<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>내 마음속 Grimo 찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#09090f;color:#f0eef8;font-family:'Noto Sans KR',sans-serif;overflow-x:hidden;transition:background .7s ease}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;animation:fi .42s ease}
.screen.on{display:flex}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── MAIN ── */
.main-wrap{text-align:center;max-width:360px;width:100%}
/* 메인 오브 — admin에서 이미지 등록하면 이미지로 교체됨 */
.main-orb-wrap{width:224px;height:224px;border-radius:50%;margin:0 auto 26px;position:relative;cursor:pointer}
.main-orb-bg{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c4b5fd,#7c3aed 55%,#1e0050);box-shadow:0 0 60px rgba(124,58,237,.55);animation:op 3.2s ease-in-out infinite;position:relative;overflow:hidden}
.main-orb-bg img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:none}
.main-orb-bg img.on{display:block}
.main-orb-bg::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.2),transparent 60%);pointer-events:none}
@keyframes op{0%,100%{box-shadow:0 0 60px rgba(124,58,237,.55)}50%{box-shadow:0 0 100px rgba(124,58,237,.75)}}
.main-title{font-family:'Noto Serif KR',serif;font-size:25px;font-weight:700;margin-bottom:10px;line-height:1.45;background:linear-gradient(135deg,#e9d5ff,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.main-sub{font-size:14px;color:#a899c8;line-height:1.85;margin-bottom:32px}
.main-sub b{color:#d4b8ff}
.start-btn{width:100%;padding:17px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;border-radius:16px;color:#fff;font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 8px 28px rgba(124,58,237,.42);transition:transform .2s,box-shadow .2s}
.start-btn:hover{transform:translateY(-2px)}
.badge-row{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.badge{background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.25);border-radius:20px;padding:5px 13px;font-size:12px;color:#b899e8}
/* 메인 하단 SNS 버튼 */
.main-sns{display:flex;gap:10px;margin-top:20px}
.main-sns-btn{flex:1;padding:12px 8px;border:1.5px solid rgba(255,255,255,.1);border-radius:13px;background:transparent;color:#b899e8;font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
.main-sns-btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}

/* ── QUESTION ── */
.q-wrap{max-width:400px;width:100%}
.prog-info{display:flex;justify-content:space-between;margin-bottom:8px}
.prog-num{font-size:13px;color:#9880c0}
.prog-bar{width:100%;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-bottom:28px}
.prog-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#60a5fa);border-radius:2px;transition:width .42s ease}
.q-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:28px 22px;margin-bottom:18px;min-height:92px;display:flex;align-items:center}
.q-text{font-size:16px;line-height:1.8;color:#ede8ff;text-align:center;width:100%}
.choices{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.c-btn{display:flex;align-items:center;gap:13px;padding:15px 16px;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;cursor:pointer;width:100%;font-family:'Noto Sans KR',sans-serif;color:#cfc8e8;font-size:15px;transition:all .18s;text-align:left}
.c-btn:hover{background:rgba(124,58,237,.1);border-color:rgba(124,58,237,.35)}
.c-btn.sel{background:rgba(124,58,237,.18);border-color:#7c3aed;color:#e9d5ff}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.18);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s}
.c-btn.sel .radio{border-color:#7c3aed;background:#7c3aed}
.rdot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s}
.c-btn.sel .rdot{opacity:1}
.warn{color:#f87171;font-size:13px;text-align:center;min-height:20px;margin-bottom:8px}
.nav-row{display:flex;gap:10px}
.nav-btn{flex:1;padding:14px;border:1.5px solid rgba(255,255,255,.1);border-radius:13px;background:transparent;color:#b899e8;font-size:14px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .18s}
.nav-btn:hover{background:rgba(255,255,255,.05)}
.nav-btn.pri{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:transparent;color:#fff;font-weight:700}
.nav-btn:disabled{opacity:.26;cursor:not-allowed}

/* ── RESULT ── */
.res-wrap{width:100%;max-width:400px;padding-bottom:36px}
/* 카드 이미지만 — 텍스트 없음 */
#card-canvas{display:block;width:100%;border-radius:22px;margin-bottom:0}

/* 카드 아래 결과 요약 텍스트 박스 */
.result-summary{padding:20px 4px 16px;text-align:center}
.result-type-label{font-size:11px;letter-spacing:3px;opacity:.5;text-transform:uppercase;margin-bottom:8px}
.result-title{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;margin-bottom:10px;line-height:1.3}
.result-one-line{font-size:14px;color:#c4b8e0;line-height:1.7;margin-bottom:6px}

.dl-btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#fff;margin:6px 0 20px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.dl-btn:hover{opacity:.9;transform:translateY(-1px)}
.res-sections{display:flex;flex-direction:column;gap:12px}
.res-sec{border-radius:18px;padding:20px;border:1px solid rgba(255,255,255,.07)}
.sec-label{font-size:11px;letter-spacing:2.5px;margin-bottom:10px;opacity:.5;text-transform:uppercase}
.sec-txt{font-size:14px;line-height:1.9;color:#ddd5f0}
.lucky-row{display:flex;align-items:center;gap:12px}
.lucky-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.kw-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.kw{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid}
.shop-btn{width:100%;padding:17px;border:none;border-radius:16px;color:#fff;font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:14px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.shop-btn:hover{opacity:.9;transform:translateY(-2px)}
.sns-row{display:flex;gap:10px;margin-top:10px}
.sns-btn{flex:1;padding:13px 8px;border:1.5px solid rgba(255,255,255,.1);border-radius:14px;background:transparent;color:#d0c8e8;font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.sns-btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}
.retry-btn{width:100%;padding:12px;border-radius:13px;background:transparent;border:1px solid rgba(255,255,255,.08);color:#6a5a8a;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:10px}
</style>
</head>

</div>

<!-- QUESTION -->
<div class="screen" id="sc-q">

    <div class="warn" id="warn"></div>
    <div class="nav-row">
      <button class="nav-btn" id="btn-prev" onclick="prevQ()">← 이전</button>
      <button class="nav-btn pri" id="btn-next" onclick="nextQ()">다음 →</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="sc-res">
  <div class="res-wrap">
    <!-- 결과 카드: 이미지(배경)만, 텍스트 없음 -->
    <canvas id="card-canvas"></canvas>

    <div class="result-summary">
      <div class="result-type-label" id="r-type-label"></div>
      <div class="result-title" id="r-title"></div>
      <div class="result-one-line" id="r-one-line"></div>
    </div>

    <button class="dl-btn" id="dl-btn" onclick="downloadCard()">↓ 결과 카드 저장하기</button>
    <div class="res-sections" id="res-sections"></div>
    <button class="shop-btn" id="shop-btn" onclick="window.open('https://marpple.shop/kr/IO_Grimo','_blank')">✦ 내 Grimo 만나러 가기</button>
    <div class="sns-row">
      <a class="sns-btn" href="https://www.instagram.com/io_grimo/" target="_blank">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>

</div>

const CHOICES=[
  {label:"매우 그렇다",score:5},{label:"어느 정도 그렇다",score:4},
  {label:"보통이다",score:3},{label:"별로 아니다",score:2},{label:"전혀 아니다",score:1}
];

let curQ=0,answers=new Array(30).fill(null),finalType=null;

/* 메인 오브 이미지 로드 */
function loadMainOrb(){
  const img=document.getElementById('main-orb-img');
  img.src='images/main.jpg';
  img.classList.add('on');
}
loadMainOrb();

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function startTest(){curQ=0;answers=new Array(30).fill(null);renderQ();showScreen('sc-q');}
function renderQ(){
  const q=QS[curQ];
  document.getElementById('qnum').textContent=(curQ+1)+' / 30';
  document.getElementById('qpct').textContent=Math.round((curQ+1)/30*100)+'%';
  document.getElementById('pgfill').style.width=((curQ+1)/30*100)+'%';
  document.getElementById('qtxt').textContent=q.text;
  document.getElementById('warn').textContent='';
  const c=document.getElementById('choices');c.innerHTML='';
  CHOICES.forEach((ch,i)=>{
    const b=document.createElement('button');
    b.className='c-btn'+(answers[curQ]===i?' sel':'');
    b.setAttribute('role','radio');b.setAttribute('aria-checked',answers[curQ]===i?'true':'false');
    b.innerHTML=`<span class="radio"><span class="rdot"></span></span><span>${ch.label}</span>`;
    b.onclick=()=>pick(i);
    c.appendChild(b);
  });
  document.getElementById('btn-prev').disabled=curQ===0;
  document.getElementById('btn-next').textContent=curQ===29?'결과 보기 ✦':'다음 →';
}
function pick(idx){
  answers[curQ]=idx;
  document.getElementById('warn').textContent='';
  document.querySelectorAll('.c-btn').forEach((b,i)=>{
    b.classList.toggle('sel',i===idx);
    b.setAttribute('aria-checked',i===idx?'true':'false');
  });
}
function prevQ(){if(curQ>0){curQ--;renderQ();}}
function nextQ(){
  if(answers[curQ]===null){document.getElementById('warn').textContent='선택지를 골라주세요!';return;}
  if(curQ<29){curQ++;renderQ();}else calcResult();
}
function calcResult(){
  const scores={RED:0,ORANGE:0,YELLOW:0,GREEN:0,BLUE:0,PURPLE:0,BLACK:0,WHITE:0};
  answers.forEach((ai,qi)=>Object.entries(QS[qi].w).forEach(([t,w])=>scores[t]+=CHOICES[ai].score*w));
  let maxS=-1,top=[];
  Object.entries(scores).forEach(([t,s])=>{
    const r=Math.round(s*100)/100;
    if(r>maxS){maxS=r;top=[t];}else if(Math.abs(r-maxS)<0.01)top.push(t);
  });
  if(top.length>1){
    const ts={};top.forEach(t=>ts[t]=0);
    answers.slice(20).forEach((ai,i)=>Object.entries(QS[20+i].w).forEach(([t,w])=>{if(ts.hasOwnProperty(t))ts[t]+=CHOICES[ai].score*w;}));
    finalType=top.reduce((a,b)=>ts[a]>=ts[b]?a:b);
  }else finalType=top[0];
  console.log('finalType:',finalType,'scores:',scores);
  applyTheme();buildSections();
  showScreen('sc-res');
  requestAnimationFrame(()=>requestAnimationFrame(drawCard));
}
function applyTheme(){
  const r=RD[finalType];
  document.body.style.background=r.pageBg;
  document.getElementById('dl-btn').style.background=r.shopGrad;
  document.getElementById('shop-btn').style.background=r.shopGrad;
  /* 결과 요약 텍스트 */
  document.getElementById('r-type-label').textContent=r.colorName+' Grimo';
  document.getElementById('r-title').textContent=r.title;
  document.getElementById('r-title').style.color=r.themeColor;
  document.getElementById('r-one-line').textContent=r.oneLineMsg;
}
function buildSections(){
  const r=RD[finalType];
  const ss=`background:${r.secBg};border-color:${r.pageBorder}`;
  document.getElementById('res-sections').innerHTML=`
    <div class="res-sec" style="${ss}"><div class="sec-label">지금의 당신은</div><div class="sec-txt">${r.currentEmotion}</div></div>
    <div class="res-sec" style="${ss}"><div class="sec-label">왜 이 Grimo가 나왔는지</div><div class="sec-txt">${r.why}</div></div>
    <div class="res-sec" style="${ss}"><div class="sec-label">앞으로의 흐름</div><div class="sec-txt">${r.futureFlow}</div></div>
    <div class="res-sec" style="${ss}"><div class="sec-label">시련이 왔을 때</div><div class="sec-txt">${r.hardship}</div></div>
    <div class="res-sec" style="${ss}">
      <div class="sec-label">행운 아이템 ✦</div>
      <div class="lucky-row"><div class="lucky-ic" style="background:${r.themeColor}22">${r.emoji}</div><div class="sec-txt">${r.luckyItem}</div></div>
    </div>
    <div class="res-sec" style="${ss}">
      <div class="sec-label">행운의 키워드</div>
      <div class="kw-row">${r.keywords.map(k=>`<span class="kw" style="color:${r.themeColor};border-color:${r.themeColor}44;background:${r.themeColor}11">${k}</span>`).join('')}</div>
    </div>`;
}

/* ================================================================
   drawCard — 배경 이미지만, 텍스트 전혀 없음
   admin.html에서 올린 배경이 있으면 cover로 꽉 채움
   없으면 기본 그라디언트만
   ================================================================ */
function drawCard(){
  const r=RD[finalType];
  const cv=document.getElementById('card-canvas');
  const rect=cv.getBoundingClientRect();
  const cssW=rect.width;
  const dpr=window.devicePixelRatio||1;
  const PW=Math.round(cssW*dpr);
  const PH=Math.round(PW*1.25);
  cv.width=PW; cv.height=PH;
  cv.style.height='auto';
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  const W=cssW, H=cssW*1.25;

  function drawCover(img){
    const iw=img.naturalWidth,ih=img.naturalHeight;
    const ir=iw/ih,cr=W/H;
    let sx,sy,sw,sh;
    if(ir>cr){sh=ih;sw=sh*cr;sx=(iw-sw)/2;sy=0;}
    else{sw=iw;sh=sw/cr;sx=0;sy=(ih-sh)/2;}
    ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
  }

  function drawDefaultCard(){
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,r.cardGrad1);bg.addColorStop(.5,r.cardGrad2);bg.addColorStop(1,r.cardGrad3);
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const lo=ctx.createRadialGradient(W*.5,0,0,W*.5,H*.5,H*.7);
    lo.addColorStop(0,'rgba(255,255,255,.15)');lo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lo;ctx.fillRect(0,0,W,H);
    const cx=W*.5,cy=H*.4,rad=W*.22;
    const og=ctx.createRadialGradient(cx-rad*.28,cy-rad*.28,0,cx,cy,rad);
    og.addColorStop(0,'rgba(255,255,255,.7)');og.addColorStop(.4,r.themeColor+'cc');og.addColorStop(1,r.cardGrad1);
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=og;ctx.fill();
    const sg=ctx.createRadialGradient(cx-rad*.3,cy-rad*.3,0,cx-rad*.3,cy-rad*.3,rad*.5);
    sg.addColorStop(0,'rgba(255,255,255,.38)');sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();
    ctx.font=`${rad*.8}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(r.emoji,cx,cy);
  }

  const bgMap={
    BLUE:'images/bg1.jpg',
    GREEN:'images/bg2.jpg',
    YELLOW:'images/bg3.jpg',
    ORANGE:'images/bg4.jpg',
    RED:'images/bg5.jpg',
    WHITE:'images/bg6.jpg',
    BLACK:'images/bg7.jpg',
    PURPLE:'images/bg8.jpg'
  };

  const bi=new Image();
  bi.onload=()=>drawCover(bi);
  bi.onerror=()=>drawDefaultCard();
  bi.src=bgMap[finalType];
}

function downloadCard(){
  const cv=document.getElementById('card-canvas');
  const a=document.createElement('a');
  a.download='grimo-'+finalType.toLowerCase()+'-result.png';
  a.href=cv.toDataURL('image/png');a.click();
}
function reset(){
  curQ=0;answers=new Array(30).fill(null);finalType=null;
  document.body.style.background='#09090f';
  showScreen('sc-main');
}
</script>
